// ---- terminal ------------------------------------------------------------
const out = document.getElementById('out');
const input = document.getElementById('in');
const term = document.getElementById('term');
const ps1El = document.getElementById('ps1');
const started = Date.now();
let cwd = [];               // [] = ~, ['public'], ['public', 'agriflow']
const hist = []; let hi = 0;

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const run = (cmd, label = cmd) => `<button class="run" data-cmd="${esc(cmd)}">${esc(label)}</button>`;
const chips = (...cmds) => `<div class="chips-out">${cmds.map((c) => run(...[].concat(c))).join('')}</div>`;
const ps1 = () => `<span class="prompt">[<span class="u">burak@archlinux</span> <span class="p">${esc(cwd.length ? cwd[cwd.length - 1] : '~')}</span>]$</span>`;
const print = (html, cls = '') => { const d = document.createElement('div'); d.className = 'new ' + cls; d.innerHTML = html; out.appendChild(d); };
const scroll = () => { term.scrollTop = term.scrollHeight; };

const find = (name) => {
  for (const vis of ['public', 'private']) if (PROJECTS[vis][name]) return [vis, name];
  return null;
};
// resolve a path against cwd to a cwd array, or null
const resolve = (arg) => {
  if (!arg || arg === '~') return [];
  const parts = arg.startsWith('~') ? [] : [...cwd];
  for (const seg of arg.replace(/^~\/?/, '').split('/').filter(Boolean)) {
    if (seg === '.') continue;
    if (seg === '..') { parts.pop(); continue; }
    parts.push(seg);
  }
  if (parts.length === 0) return parts;
  if (parts.length === 2 && PROJECTS[parts[0]] && PROJECTS[parts[0]][parts[1]]) return parts;
  if (parts.length === 1 && PROJECTS[parts[0]]) return parts;
  return find(parts[parts.length - 1]);   // `cd agriflow` works from anywhere
};
const here = () => (cwd.length === 2 ? PROJECTS[cwd[0]][cwd[1]] : null);

const listRoot = (vis) => {
  const rows = [];
  for (const v of vis ? [vis] : ['public', 'private']) {
    rows.push(v === 'public'
      ? `<span class="h">public/</span>   <span class="dim"># herkese açık, kodu GitHub’da</span>`
      : `<span class="h">private/</span>  <span class="dim"># şirket işleri, kodu gizli, yalnızca özet</span>`);
    for (const [name, p] of Object.entries(PROJECTS[v])) {
      const perm = v === 'private' ? 'drwx------' : 'drwxr-xr-x';
      rows.push(`<span class="perm dim">  ${perm} </span>${run('cd ' + name, name)}<span class="pad">${' '.repeat(Math.max(1, 22 - name.length))}</span><span class="ttl dim">${esc(p.title)}</span>`);
    }
    rows.push('');
  }
  rows.push(`<span class="dim">Bir projeye tıkla ya da</span> cd &lt;proje&gt; <span class="dim">yaz.</span>`);
  return rows.join('\n');
};

const readme = (vis, name) => {
  const p = PROJECTS[vis][name];
  const head = `<span class="h">${esc(name)}</span>  <span class="dim">— ${esc(p.title)}</span>\n<span class="dim">${'─'.repeat(Math.min(60, name.length + p.title.length + 5))}</span>`;
  const body = head + '\n' + p.readme.join('\n') + `\n\n<span class="acc2">stack</span>  ${esc(p.stack)}`;
  if (vis === 'public') return body + chips(['cat ARCH.md', 'mimari'], ['github', 'GitHub’da aç'], 'cd ..');
  return body + `\n\n<span class="warn">Gizli proje: kaynak kodu ve mimari detayları paylaşılamıyor.</span>` + chips('cd ..', ['ls ~/public', 'açık projeler']);
};

const neofetch = () => {
  const mins = Math.floor((Date.now() - started) / 60000);
  const pub = Object.keys(PROJECTS.public).length, priv = Object.keys(PROJECTS.private).length;
  const info = [
    `<span class="acc"><b>burak</b></span>@<span class="acc"><b>archlinux</b></span>`,
    '<span class="dim">─────────────────</span>',
    `<span class="acc">OS</span>: Arch Linux x86_64`,
    `<span class="acc">Host</span>: buraksanlilar.github.io`,
    `<span class="acc">Kernel</span>: 6.17.4-arch1-1`,
    `<span class="acc">Uptime</span>: ${mins} dk`,
    `<span class="acc">Packages</span>: ${pub + priv} (${pub} public, ${priv} private)`,
    `<span class="acc">Shell</span>: bash 5.3`,
    `<span class="acc">Langs</span>: C#, TypeScript, Python`,
    `<span class="acc">Mail</span>: <a href="mailto:${MAIL}">${MAIL}</a>`,
    `<span class="acc">GitHub</span>: <a href="${GH}" target="_blank" rel="noopener">github.com/buraksanlilar</a>`,
    '',
    ['#0d1117', '#f47067', '#8ae234', '#e5c07b', '#1793d1', '#bc8cff', '#5fb4e6', '#c9d1d9'].map((c) => `<span class="swatch" style="background:${c}"></span>`).join(''),
  ].join('\n');
  return `<div class="fetch"><pre class="logo">${esc(document.getElementById('logo').content.textContent)}</pre><div>${info}</div></div>`;
};

const HELP = [
  '<b>Komutlar</b>',
  `  ${run('ls')}                  projeleri listele`,
  `  cd &lt;proje&gt;          projeye gir ve README’yi oku`,
  `  ${run('cat README.md')}       bulunduğun projenin özeti`,
  `  ${run('cat ARCH.md')}         mimari (public projeler)`,
  `  ${run('github')}              projenin GitHub sayfasını aç`,
  `  ${run('cd ..')}               bir üst klasöre çık`,
  `  ${run('neofetch')}            sistem bilgisi`,
  `  ${run('contact')}             iletişim`,
  `  ${run('history')}, ${run('pwd')}, ${run('clear')}, echo, date`,
  '',
  '<span class="dim">Tab ile tamamla, ↑ ↓ ile geçmişte gez, Ctrl+L ile temizle.</span>',
].join('\n');

const notFound = (cmd, f) => `<span class="err">${cmd}: ${esc(f)}: Böyle bir dosya ya da dizin yok</span>`;
const COMMANDS = {
  help: () => HELP,
  ls: (args) => {
    const target = args[0] ? resolve(args[0]) : cwd;
    if (!target) return notFound('ls', args[0]);
    if (target.length === 0) return listRoot();
    if (target.length === 1) return listRoot(target[0]);
    return target[0] === 'public' ? `${run('cat README.md', 'README.md')}  ${run('cat ARCH.md', 'ARCH.md')}` : run('cat README.md', 'README.md');
  },
  cd: (args) => {
    const target = resolve(args[0] || '~');
    if (!target) return `<span class="err">bash: cd: ${esc(args[0])}: Böyle bir dosya ya da dizin yok</span>`;
    cwd = target;
    if (cwd.length === 2) return readme(cwd[0], cwd[1]);
    if (cwd.length === 1) return listRoot(cwd[0]);
    return '';
  },
  cat: (args) => {
    const f = args[0];
    if (!f) return '<span class="err">cat: dosya adı eksik</span>';
    const p = here();
    if (!p) return notFound('cat', f) + `\n<span class="dim">Önce bir projeye gir:</span> ${run('ls')}`;
    if (f === 'README.md') return readme(cwd[0], cwd[1]);
    if (f === 'ARCH.md') {
      if (cwd[0] === 'private') return `<span class="err">cat: ARCH.md: Permission denied</span>\n<span class="dim">Gizli projenin mimarisi paylaşılamıyor.</span>`;
      return `<span class="h">${esc(cwd[1])}/ARCH.md</span>\n\n<pre class="acc2">${esc(p.arch)}</pre>` + chips(['cat README.md', 'README'], ['github', 'GitHub’da aç'], 'cd ..');
    }
    return notFound('cat', f);
  },
  github: (args) => {
    const target = args[0] ? find(args[0]) : (cwd.length === 2 ? cwd : null);
    if (args[0] && !target) return `<span class="err">github: '${esc(args[0])}' diye bir proje yok</span>`;
    if (target && target[0] === 'private') return `<span class="err">fatal: repository '${esc(target[1])}' is private</span>\n<span class="dim">Bu proje şirkete ait, burada yalnızca özeti var.</span>`;
    const url = target ? GH + PROJECTS.public[target[1]].repo : GH;
    window.open(url, '_blank', 'noopener');
    return `<span class="ok">→</span> <a href="${url}" target="_blank" rel="noopener">${url}</a> <span class="dim">(yeni sekmede açıldı)</span>`;
  },
  neofetch,
  whoami: () => 'burak',
  contact: () => [
    `<span class="acc">mail</span>    <a href="mailto:${MAIL}">${MAIL}</a>`,
    `<span class="acc">github</span>  <a href="${GH}" target="_blank" rel="noopener">github.com/buraksanlilar</a>`,
  ].join('\n') + chips(['mail', 'e-posta gönder']),
  mail: () => { location.href = 'mailto:' + MAIL; return `<span class="ok">→</span> ${MAIL}`; },
  pwd: () => '/home/burak' + (cwd.length ? '/' + cwd.join('/') : ''),
  history: () => hist.map((h, i) => `${String(i + 1).padStart(4)}  ${esc(h)}`).join('\n'),
  echo: (args) => esc(args.join(' ')),
  date: () => new Date().toString(),
  clear: () => { out.innerHTML = ''; return null; },
  sudo: () => '<span class="err">burak is not in the sudoers file. This incident will be reported.</span>',
  pacman: () => ':: Synchronizing package databases...\n core is up to date\n extra is up to date\n<span class="dim">her şey güncel</span>',
  exit: () => '<span class="dim">logout... şaka, buradan çıkış yok.</span> ' + run('contact', 'iletişime geç'),
  vim: () => '<span class="dim">vim’den çıkamayabilirsin, açmayalım.</span>',
};
Object.assign(COMMANDS, { iletisim: COMMANDS.contact, open: COMMANDS.github, cls: COMMANDS.clear, dir: COMMANDS.ls });

const exec = (line) => {
  line = line.trim();
  print(`${ps1()} ${esc(line)}`);
  if (line) hist.push(line);
  hi = hist.length;
  for (const part of line.split('&&').map((s) => s.trim()).filter(Boolean)) {
    const [cmd, ...args] = part.split(/\s+/);
    const fn = COMMANDS[cmd.toLowerCase()];
    if (!fn) { print(`<span class="err">bash: ${esc(cmd)}: komut bulunamadı</span>  <span class="dim">yardım için</span> ${run('help')}`, 'block'); break; }
    const res = fn(args);
    if (res) print(res, 'block');
  }
  ps1El.innerHTML = ps1();
  scroll();
};

// tab completion: commands first, then paths
const complete = () => {
  const v = input.value; const parts = v.split(' ');
  const last = parts[parts.length - 1];
  let pool;
  if (parts.length === 1) pool = Object.keys(COMMANDS);
  else if (parts[0] === 'cat') pool = here() ? (cwd[0] === 'public' ? ['README.md', 'ARCH.md'] : ['README.md']) : [];
  else pool = cwd.length === 0 ? ['public/', 'private/', ...Object.keys(PROJECTS.public), ...Object.keys(PROJECTS.private)]
            : cwd.length === 1 ? [...Object.keys(PROJECTS[cwd[0]]), '..'] : ['..'];
  const m = pool.filter((p) => p.startsWith(last));
  if (m.length === 1) { parts[parts.length - 1] = m[0]; input.value = parts.join(' ') + (m[0].endsWith('/') ? '' : ' '); }
  else if (m.length > 1) { print(`${ps1()} ${esc(v)}\n${m.map(esc).join('  ')}`); scroll(); }
};

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { exec(input.value); input.value = ''; }
  else if (e.key === 'Tab') { e.preventDefault(); complete(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); if (hi > 0) input.value = hist[--hi]; }
  else if (e.key === 'ArrowDown') { e.preventDefault(); hi = Math.min(hist.length, hi + 1); input.value = hist[hi] || ''; }
  else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); out.innerHTML = ''; }
});
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-cmd]');
  if (b) { exec(b.dataset.cmd); if (matchMedia('(hover: hover)').matches) input.focus({ preventScroll: true }); return; }
  if (e.target.closest('#term') && !getSelection().toString() && !e.target.closest('a')) input.focus({ preventScroll: true });
});

const tick = () => { document.getElementById('clock').textContent = new Date().toLocaleString('tr-TR', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };
tick(); setInterval(tick, 30000);

// boot
ps1El.innerHTML = ps1();
print(neofetch(), 'block');
print(`Hoş geldin. Burası gerçek bir terminal: komut yazabilir ya da altı çizili her şeye tıklayabilirsin.\nYardım için ${run('help')}.`, 'block');
exec('ls');
if (matchMedia('(hover: hover)').matches) input.focus();
</script>
</body>
